version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file: .env
    depends_on:
      - redis
      - postgres
    restart: always
    networks:
      - arbitra-net

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - arbitra-net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: arbitra
      POSTGRES_USER: arbitra
      POSTGRES_PASSWORD: secure_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
    networks:
      - arbitra-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    restart: always
    networks:
      - arbitra-net

volumes:
  redis_data:
  pg_data:

networks:
  arbitra-net:
    driver: bridge
